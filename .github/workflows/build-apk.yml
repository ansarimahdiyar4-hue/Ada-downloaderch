name: Build Bepar VPN 1.6.4

on:
  workflow_dispatch:
  push:
    paths:
      - 'BeparVPN-1.6.4-Final.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: bepar-vpn-1.6.4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s BeparVPN-1.6.4-Final.zip
          unzip -t BeparVPN-1.6.4-Final.zip

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q BeparVPN-1.6.4-Final.zip -d source
          test -s source/settings.gradle.kts
          test -s source/build.gradle.kts
          test -s source/app/build.gradle.kts
          test -s source/scripts/build_libxray.sh
          test -s source/scripts/verify_project.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -d "$ANDROID_SDK_ROOT/ndk/27.2.12479018"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-cleanup: on-success

      - name: Verify project
        working-directory: source
        run: |
          python scripts/verify_project.py

      - name: Build libXray
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_libxray.sh
          test -s app/libs/libXray.aar

      - name: Run unit tests
        working-directory: source
        run: |
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest

      - name: Run Android Lint
        continue-on-error: true
        working-directory: source
        run: |
          gradle --no-daemon --stacktrace \
            :app:lintDebug

      - name: Build APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace \
            :app:assembleDebug

          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeparVPN-1.6.4-Final-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BeparVPN-1.6.4-Build-Reports
          path: |
            source/app/build/reports/**
            source/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
